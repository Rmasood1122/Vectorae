name: verify
# Deep verification beyond the offline eval gate (Phase 1 item 1.6).
# Plan and minutes budget: docs/program/plans/phase1-06-verify-workflows.md
#
# Rules this file follows:
# - Heavy jobs run only on non-draft PRs and on pushes to master. Drafts get
#   eval-gate only (2,000 Actions minutes/month on GitHub Free).
# - "Skip but succeed": a job whose area the PR does not touch still runs and
#   reports success after a cheap scope check, so a check that matters can
#   never be left "pending" or "skipped" on a PR that safe_merge evaluates.
# - Every gating command's exit code is read directly, never through a pipe.
# - Third-party actions are pinned to full commit SHAs.
# - Job names are unique across all workflows (GitHub and Vercel identify
#   checks by job name).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"

jobs:
  verify-backend-postgres:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # PostgreSQL 16 with pgvector 0.8.1: alembic 0094 (help_chunks) needs
        # halfvec + HNSW, and tests/integration/test_help_index_pg.py is the
        # Help AI v2 Phase 2 exit gate (it fails, never skips, under CI).
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_USER: leadpilot
          POSTGRES_PASSWORD: leadpilot
          POSTGRES_DB: clienthunter_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U leadpilot" --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6380:6379"]
    env:
      TEST_DATABASE_URL: postgresql://leadpilot:leadpilot@localhost:5433/clienthunter_test
      TEST_REDIS_URL: redis://localhost:6380/15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base" HEAD | grep -qE '^(app/|alembic/|tests/integration/|requirements\.txt|pyproject\.toml|alembic\.ini)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No backend, migration or integration-test changes: skipped (success)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: pip install -r requirements.txt fakeredis pyyaml pytest pytest-asyncio pytest-mock
      - name: Single Alembic head
        if: steps.scope.outputs.run == 'true'
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          heads = ScriptDirectory.from_config(Config("alembic.ini")).get_heads()
          print("heads:", heads)
          raise SystemExit(0 if len(heads) == 1 else 1)
          PY
      - name: Migrations upgrade, downgrade -1, upgrade (empty database)
        if: steps.scope.outputs.run == 'true'
        env:
          APP_ENV: test
          DATABASE_URL: postgresql://leadpilot:leadpilot@localhost:5433/verify_migrations
          PGPASSWORD: leadpilot
        run: |
          psql -h localhost -p 5433 -U leadpilot -d clienthunter_test -c "CREATE DATABASE verify_migrations"
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
      - name: PostgreSQL integration suite
        if: steps.scope.outputs.run == 'true'
        run: python -m pytest tests/integration -q -p no:cacheprovider

  verify-frontend:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      # next.config.js refuses to load (even for `next lint`) without it; a
      # non-local placeholder satisfies the build-time guard.
      NEXT_PUBLIC_API_URL: https://api.example.invalid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Scope
        id: scope
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          base="${{ github.event.pull_request.base.sha }}"
          # docs/help-center/ is the source of the in-app help copy that
          # frontend/src/tests/helpCenterCopy.test.ts compares against, so a
          # docs-only article change must run the frontend tests too (#128
          # skipped them and left master red until #134).
          if git diff --name-only "$base" HEAD | grep -qE '^(frontend/|docs/help-center/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No frontend changes: skipped (success)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        if: steps.scope.outputs.run == 'true'
        run: npm ci --no-audit --no-fund
      - name: Type-check
        if: steps.scope.outputs.run == 'true'
        run: npm run type-check
      - name: Lint
        if: steps.scope.outputs.run == 'true'
        run: npm run lint
      - name: Unit tests
        if: steps.scope.outputs.run == 'true'
        run: npm test
      - name: Production build (static export)
        if: steps.scope.outputs.run == 'true'
        run: npm run build

  verify-status-page:
    # status.calendarharvest.com (Phase 3; docs/program/STATUS_PAGE.md).
    # Incident-only PRs land here too: incident-lint runs first so a bad
    # front matter fails in about a minute. No env vars are set on purpose:
    # the build must pass without UPTIMEROBOT_API_KEY or LEADPILOT_API_URL.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: status-page
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Scope
        id: scope
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base" HEAD | grep -qE '^status-page/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No status-page changes: skipped (success)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.scope.outputs.run == 'true'
        with:
          # 22.18+ runs the TypeScript tests and scripts natively (type stripping).
          node-version: "22"
          cache: npm
          cache-dependency-path: status-page/package-lock.json
      - name: npm ci
        if: steps.scope.outputs.run == 'true'
        run: npm ci --no-audit --no-fund
      - name: Incident lint
        if: steps.scope.outputs.run == 'true'
        run: npm run incident-lint
      - name: Type-check
        if: steps.scope.outputs.run == 'true'
        run: npm run type-check
      - name: Unit tests (data layer, incidents, feeds, contrast)
        if: steps.scope.outputs.run == 'true'
        run: npm test
      - name: Production build (no env vars)
        if: steps.scope.outputs.run == 'true'
        run: npm run build

  verify-image:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base" HEAD | grep -qE '^(app/|alembic/|native/|scripts/render_.*\.sh|Dockerfile|\.dockerignore|requirements\.txt|pyproject\.toml|alembic\.ini)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No image inputs changed: skipped (success)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build production image
        if: steps.scope.outputs.run == 'true'
        run: docker build --target production -t leadpilot-verify:ci .
      - name: Every application module imports inside the image
        if: steps.scope.outputs.run == 'true'
        # The structlog and firebase-admin outages were both "declared in
        # requirements.txt but missing from the image". Importing app.main
        # and the worker app inside the built image catches that class.
        run: |
          docker run --rm -e APP_ENV=test -e DATABASE_URL=sqlite:// \
            leadpilot-verify:ci python -c "import app.main, app.workers.celery_app, firebase_admin, vectorae_native_rs, vectorae_native_cpp; print('imports ok')"

  # Vectorae agents' native cores (docs/features/vectorae-agents.md). The
  # sealed eval gate installs requirements.txt only, so it runs the agents on
  # the Python reference; this job is where the Rust and C++ cores are built
  # and proven: their own unit tests, then the Python suites with the wheels
  # installed and VECTORAE_REQUIRE_NATIVE=1 (a missing module fails, never
  # skips; the parity tests hold native == reference).
  verify-native-agents:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base" HEAD | grep -qE '^(native/|app/agents/|app/api/agents\.py|tests/test_agents_)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No agent changes: skipped (success)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Rust core tests
        if: steps.scope.outputs.run == 'true'
        working-directory: native/rust
        run: cargo test --locked
      - name: C++ core tests
        if: steps.scope.outputs.run == 'true'
        working-directory: native/cpp
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          ctest --test-dir build --output-on-failure
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies and the native wheels
        if: steps.scope.outputs.run == 'true'
        run: |
          pip install -r requirements.txt fakeredis pyyaml pytest pytest-asyncio pytest-mock
          pip install ./native/rust ./native/cpp
      - name: Agent suites on the native cores
        if: steps.scope.outputs.run == 'true'
        env:
          VECTORAE_REQUIRE_NATIVE: "1"
        run: python -m pytest -q -p no:cacheprovider tests/test_agents_native_parity.py tests/test_agents_reference.py tests/test_agents_api.py

  verify-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Secrets in added lines (blocking)
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then base="${{ github.event.before }}"; else base="${{ github.event.pull_request.base.sha }}"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then base="HEAD~1"; fi
          git diff -U0 "$base" HEAD > "$RUNNER_TEMP/diff.txt"
          python scripts/gate/scan_secrets.py < "$RUNNER_TEMP/diff.txt"
      - name: Python dependency audit (report only)
        run: |
          pip install -q pip-audit
          set +e
          pip-audit -r requirements.txt -f json -o "$RUNNER_TEMP/pip-audit.json"
          set -e
          python - "$RUNNER_TEMP/pip-audit.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          try:
              deps = json.load(open(sys.argv[1])).get("dependencies", [])
          except Exception as exc:  # report-only step: never fail the job here
              print(f"pip-audit produced no readable report: {exc}"); raise SystemExit(0)
          rows = [(d["name"], d["version"], v["id"], ",".join(v.get("fix_versions") or []) or "none")
                  for d in deps for v in d.get("vulns", [])]
          print(f"### pip-audit: {len(rows)} known vulnerabilit{'y' if len(rows)==1 else 'ies'}")
          for name, ver, vid, fix in rows:
              print(f"- {name} {ver}: {vid} (fix: {fix})")
          PY
      - name: npm audit (report only)
        working-directory: frontend
        run: |
          set +e
          npm audit --omit=dev --audit-level=high > "$RUNNER_TEMP/npm-audit.txt" 2>&1
          code=$?
          set -e
          { echo "### npm audit (production deps, high+): exit $code"; echo '```'; tail -40 "$RUNNER_TEMP/npm-audit.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
