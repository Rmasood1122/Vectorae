name: Android Release Build

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
    tags:
      - 'release/*'
      - 'v*.*.*'
  workflow_dispatch:    # allow manual trigger from GitHub Actions UI

# ── Required secrets (set in Settings → Secrets → Actions) ───────────────────
# KEYSTORE_BASE64                      — base64-encoded release keystore file
# KEYSTORE_PASSWORD                    — keystore file password
# KEY_ALIAS                            — key alias (e.g. "clienthunter")
# KEY_PASSWORD                         — individual key password
# NEXT_PUBLIC_API_URL_PROD             — production backend URL (e.g. https://api.clienthunter.app)
# FIREBASE_GOOGLE_SERVICES_JSON_BASE64 — base64-encoded google-services.json from Firebase console
#
# See SIGNING.md for how to generate KEYSTORE_BASE64.
# See FIREBASE_SETUP_CHECKLIST.md for how to get google-services.json.

jobs:
  build-android-release:
    name: Build signed Android AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java (required by Gradle / Android build tools) ───────────────────
      # TODO: verify current Capacitor JDK requirement; was JDK 11 in Cap 4, likely 17 in Cap 6
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'   # Eclipse Temurin (AdoptOpenJDK successor)
          java-version: '17'
          cache: 'gradle'

      # ── 3. Node.js (required by Next.js build + Capacitor CLI) ───────────────
      # Next.js 16 needs Node 20.9 or newer; 22 matches verify-frontend and
      # the frontend Dockerfile (node:22-alpine).
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ── 4. Install frontend dependencies ─────────────────────────────────────
      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci

      # ── 5. Decode google-services.json ───────────────────────────────────────
      # The Firebase google-services.json is stored as a base64 CI secret because
      # it contains API keys and must never be committed to the repo.
      - name: Decode google-services.json
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" | base64 -d \
            > frontend/android/app/google-services.json

      # ── 6. Build Next.js static export (prod profile) ────────────────────────
      - name: Build Next.js static export
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL_PROD }}
          NEXT_PUBLIC_BUILD_TARGET: mobile-prod
        run: npm run build

      # ── 7. Sync web assets to Android platform ────────────────────────────────
      - name: Capacitor sync
        working-directory: frontend
        run: npx cap sync android

      # ── 8. Decode release keystore ────────────────────────────────────────────
      # Written to a RAM-backed temp directory (mktemp -d uses /tmp on Linux, which
      # is typically in-memory via tmpfs). The dir path is exported to GITHUB_ENV
      # so the cleanup step can delete it unconditionally even if later steps fail.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_DIR=$(mktemp -d)
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_DIR/release.keystore"
          echo "KEYSTORE_PATH=$KEYSTORE_DIR/release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_DIR=$KEYSTORE_DIR" >> "$GITHUB_ENV"

      # ── 9. Build signed AAB (Android App Bundle) ──────────────────────────────
      # bundleProdRelease = bundle (AAB format, not APK) + prod flavor + release type.
      # AAB is what the Play Store requires (since 2021 for new apps).
      # The Play Store re-signs the final APK delivered to users if Play App Signing is enabled.
      - name: Build signed AAB
        working-directory: frontend/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleProdRelease \
            --no-daemon \
            --stacktrace

      # ── 10. Locate the AAB ────────────────────────────────────────────────────
      - name: Find built AAB
        run: |
          find frontend/android -name "*.aab" -type f
          AAB_PATH=$(find frontend/android/app/build/outputs/bundle -name "*.aab" | head -1)
          echo "AAB_PATH=$AAB_PATH" >> "$GITHUB_ENV"

      # ── 11. Upload AAB as workflow artifact ────────────────────────────────────
      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: clienthunter-prod-release-${{ github.sha }}
          path: ${{ env.AAB_PATH }}
          retention-days: 30
          if-no-files-found: error

      # ── 12. Cleanup secrets from disk ─────────────────────────────────────────
      # `if: always()` ensures cleanup runs even if earlier steps fail.
      # This prevents the keystore and google-services.json from being left on the
      # CI runner's ephemeral filesystem between jobs (belt-and-suspenders).
      - name: Cleanup secrets from disk
        if: always()
        run: |
          rm -rf "$KEYSTORE_DIR" || true
          rm -f frontend/android/app/google-services.json || true
          echo "Secrets cleaned up."

  # ── Optional: notify on failure ───────────────────────────────────────────────
  # TODO: add a notification step (Slack / email) on failure for production releases
  # using a secret SLACK_WEBHOOK_URL and the slackapi/slack-github-action action.
