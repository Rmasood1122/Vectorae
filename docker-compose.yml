version: "3.9"

# One build definition for every service that runs the backend image.
# PYTHON_IMAGE pins the Debian 12 (bookworm) Python base for local builds: the
# default python:3.11-slim is Debian trixie, and a Docker Desktop with a corrupt
# cached trixie layer fails every build with "exec format error". Production
# (Render, docker-compose.prod.yml) does not pass it and keeps the Dockerfile
# default.
x-backend-build: &backend-build
  context: .
  args:
    PYTHON_IMAGE: python:3.11-slim-bookworm

services:
  db:
    # pgvector (help-center search, migration 0094), the same image CI uses.
    # Debian-based, so text sorts with glibc, not Alpine's musl: an EXISTING
    # local volume made by postgres:16-alpine must be recreated (`docker compose down -v`
    # drops local dev data) or dumped and restored, never reused. Steps: DEPLOY.md, "Moving to the pgvector
    # image".
    image: pgvector/pgvector:0.8.1-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: leadpilot
      POSTGRES_PASSWORD: leadpilot
      POSTGRES_DB: leadpilot
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadpilot"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Exposed on the host so the test suite can reach it from outside the
    # compose network. 6380 rather than 6379 to avoid colliding with a
    # Redis already running on the host.
    ports:
      - "6380:6379"

  backend:
    build: *backend-build
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      DATABASE_URL: postgresql://leadpilot:leadpilot@db:5432/leadpilot
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-min-32-chars}
      # app/core/crypto.py reads this from the environment, and the image
      # deliberately excludes .env -- without it every stored integration
      # token fails to encrypt. Taken from the project .env by compose.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      CORS_ORIGINS: http://localhost:3000,http://frontend:3000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      APOLLO_API_KEY: ${APOLLO_API_KEY:-}
      HUNTER_API_KEY: ${HUNTER_API_KEY:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
    volumes:
      - media:/app/media
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: *backend-build
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      DATABASE_URL: postgresql://leadpilot:leadpilot@db:5432/leadpilot
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-min-32-chars}
      # Tasks decrypt stored tokens (Gmail, tool integrations) -- see backend.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    volumes:
      - media:/app/media
    # -Q must list every queue in celery_app.conf.task_routes. Without it this
    # worker consumes only the implicit "celery" queue and processes nothing.
    command: celery -A app.workers.celery_app worker -Q pipeline,outreach,learning,default,notifications --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

  beat:
    build: *backend-build
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      DATABASE_URL: postgresql://leadpilot:leadpilot@db:5432/leadpilot
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-min-32-chars}
    volumes:
      - media:/app/media
    command: celery -A app.workers.celery_app beat --loglevel=info


volumes:
  pgdata:
  media:
