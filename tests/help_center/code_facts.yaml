# Every number a help-center article takes from code, checked against code.
# Read by tests/help_center/test_code_facts.py (see its docstring for the three
# checks). Maintained by hand: when you add or change a number in an article,
# add or update its entry here, or the coverage check names the number.
#
#   facts:  article (file prefix), phrase (verbatim, whitespace-collapsed),
#           expr (Python over `app`; dotted app.* paths are imported first),
#           shows (format string over v; default "{v}").
#   exempt: numbers that are not code-sourced (worked examples, vendor rules,
#           calendar facts) or are inline literals with no checkable source
#           text, each with a reason. A price can never be exempt.
#
# Values read from source text (TypeScript constants, inline literals) use a
# regex over that file, so changing the literal still fails the test.
