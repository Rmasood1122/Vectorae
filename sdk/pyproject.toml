[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clienthunter"
dynamic = ["version"]
description = "Python SDK and CLI for Vectorae — AI-powered client acquisition"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "ClientHunter", email = "hello@clienthunter.ai" }]
keywords = ["sales", "lead-generation", "outreach", "crm", "client-acquisition"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Internet :: WWW/HTTP",
    "Environment :: Console",
]

# ── Runtime deps — deliberately light ──────────────────────────────────────
# The package is a typed client + CLI over the HTTP API.
# ALL business logic (research pipeline, verification, outreach, compliance)
# lives in the backend.  Heavy server deps (FastAPI, SQLAlchemy, Celery, etc.)
# stay OUT of this base install; see the [server] extra for self-hosting.
dependencies = [
    "httpx>=0.27",          # sync HTTP client with retry primitives
    "pydantic>=2.6",        # typed response models (matches backend's Pydantic v2)
    "typer>=0.12",          # CLI framework
    "rich>=13",             # pretty terminal output (tables, progress bars)
    "pyyaml>=6",            # --file product.yaml support in `clienthunter run`
]

[project.optional-dependencies]
# `pip install "clienthunter[server]"` adds nothing Python-heavy.
# `clienthunter serve` orchestrates Docker — it does NOT import FastAPI et al.
# Docker must be installed separately (the CLI errors clearly if it's missing).
server = []

dev = [
    "pytest>=8",
    "pytest-cov",
    "respx>=0.21",          # mock httpx transport
    "build",
    "twine",
]

[project.scripts]
clienthunter = "clienthunter.cli:app"

[project.urls]
Homepage = "https://clienthunter.ai"
Documentation = "https://docs.clienthunter.ai"
Repository = "https://github.com/clienthunter/clienthunter"
"Bug Tracker" = "https://github.com/clienthunter/clienthunter/issues"
Changelog = "https://github.com/clienthunter/clienthunter/blob/main/CHANGELOG.md"

# ── Package discovery (src layout) ─────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "clienthunter._version.__version__" }

# ── Test config ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/clienthunter"]
omit = ["*/tests/*"]
