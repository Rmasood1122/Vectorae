# Render Blueprint — FREE-tier deployment of the Vectorae backend.
#
# This is ADDITIVE. railway/*.json and DEPLOY_RAILWAY.md remain the documented
# paid-tier path and are untouched; nothing here replaces them.
#
# Topology (see DEPLOY_RENDER_FREE.md for the full walkthrough):
#
#   leadpilot-api      Render Web Service (Docker)   <- this file
#   leadpilot-worker   Render Web Service (Docker)   <- this file, see note below
#   Postgres           Neon          (external, free)
#   Redis              Upstash       (external, free)
#   Frontend           Vercel        (external, free)
#
# WHY THE WORKER IS A "WEB SERVICE" AND NOT A WORKER
# Render's free plan has no free `worker` service type — `type: worker` is a
# paid-only feature. A free Web Service must bind $PORT and answer HTTP, so the
# Celery worker and beat run behind a one-route health server
# (app/worker_health.py) purely to qualify. See scripts/render_worker_entrypoint.sh.
#
#   >>> Both free services SLEEP after ~15 minutes without an inbound HTTP
#   >>> request, and a sleeping service runs NO processes. For the worker that
#   >>> means queued tasks are silently not consumed. An external pinger on
#   >>> /health every ~10 minutes is REQUIRED. Details and the exact cron-job.org
#   >>> setup are in DEPLOY_RENDER_FREE.md.
#
# ENV VARS
# Everything secret is `sync: false`, which tells Render "prompt for this, do
# not store it in the repo". Nothing below contains a credential. The full list
# of what to paste, and where each name comes from in the codebase, is in
# DEPLOY_RENDER_FREE.md.

services:
  # ---------------------------------------------------------------------------
  # API — the public FastAPI service
  # ---------------------------------------------------------------------------
  - type: web
    name: leadpilot-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # NO dockerTarget: Render's Blueprint spec has no such field (build-stage
    # targeting has been an open feature request since 2021). Harmless here —
    # the Dockerfile has exactly ONE stage, `production`, which is also the
    # final stage, so Render builds precisely the image we want anyway.

    # dockerCommand, NOT startCommand: the spec says "Docker-based services set
    # the optional dockerCommand field instead of this field."
    #
    # KEEP THIS TO BARE TOKENS — no quotes, no &&, no shell operators.
    # It previously read:
    #   dockerCommand: sh -c "python -m app.db.migrate && uvicorn app.main:app …"
    # and Render exited 127 with the ENTIRE string looked up as one program
    # name: Render's tokenizer did not preserve the nested quotes, so the shell
    # never saw `&&`. The spec documents no escaping for this, and every example
    # it gives is a single operator-free command. All shell logic therefore
    # lives in the script.
    #
    # Migrations run there rather than in preDeployCommand, because pre-deploy
    # is "available for PAID web services" only — on plan: free that is both a
    # validation error and a paid-feature reference. The race pre-deploy would
    # have avoided is handled by the advisory lock in app/db/migrate.py, which
    # only actually works when MIGRATION_DATABASE_URL points at Neon's DIRECT
    # endpoint (session update 17 — the lock does NOT serialise through the
    # pooler).
    dockerCommand: bash scripts/render_api_entrypoint.sh

    healthCheckPath: /health

    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      # --- pasted by hand in the Render dashboard ---------------------------
      - key: DATABASE_URL          # Neon POOLED endpoint, include ?sslmode=require
        sync: false
      # Neon's DIRECT (non-pooled) endpoint, for migrations only.
      # pg_advisory_lock is session-scoped and does NOT serialise through
      # Neon's PgBouncer pooler — measured 2026-08-20: a second migrator
      # acquired a lock the first was holding. Migrating on the direct
      # endpoint restores the mutual exclusion. See DEPLOY_RENDER_FREE.md.
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: REDIS_URL             # Upstash rediss://
        sync: false
      - key: CELERY_BROKER_URL     # Upstash rediss:// + ?ssl_cert_reqs=required
        sync: false
      - key: CELERY_RESULT_BACKEND # same as CELERY_BROKER_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Help AI v2 (Voyage). Empty: help-center index text-only, retrieval BM25.
      - key: VOYAGE_API_KEY
        sync: false
      - key: CORS_ORIGINS          # comma-separated, NEVER a JSON array
        sync: false
      - key: PUBLIC_BASE_URL       # this service's own https URL
        sync: false
      # The Vercel origin. NOT cosmetic: GET /auth/verify redirects the browser
      # to "$FRONTEND_URL/login?verified=true", and app/config.py defaults it to
      # http://localhost:3000 -- so leaving it unset does not fail the boot
      # guard, it just mails every user a link that lands on their own machine.
      # It was previously declared here with a key and NO value source at all,
      # which is not a valid envVar entry.
      - key: FRONTEND_URL
        sync: false
      # --- Email delivery, signup verification (Feature 1) ---------------
      # NOT `console`/`memory` in production: both accept the send and deliver
      # nothing, so signup keeps returning 201 while no user ever gets a link.
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        value: noreply@calendarharvest.com
      - key: EMAIL_FROM_NAME
        value: Vectorae
      # Secret — paste in the Render dashboard. The sending DOMAIN must be
      # verified in Resend (SPF + DKIM) or mail is dropped downstream.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_VERIFICATION_TTL_HOURS
        value: "24"
      # Kill switch. "false" disables signup verification platform-wide —
      # the escape hatch if this ever locks real users out. Leave true.
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      # --- AI support chat (Feature 3) ------------------------------------
      # Kill switch; "false" disables the chat platform-wide without a deploy.
      - key: SUPPORT_CHAT_ENABLED
        value: "true"
      # Messages per user per DAY. Every one spends ANTHROPIC_API_KEY.
      - key: RATE_LIMIT_SUPPORT_CHAT
        value: "30"
      - key: SUPPORT_CHAT_RETENTION_DAYS
        value: "30"
      - key: SUPPORT_CHAT_MIN_CONFIDENCE
        value: "0.5"
      - key: SENDER_IDENTITY       # CAN-SPAM postal address
        sync: false
      - key: ADMIN_EMAIL
        sync: false

  # ---------------------------------------------------------------------------
  # Worker — Celery worker + beat + health server in one free service
  # ---------------------------------------------------------------------------
  - type: web
    name: leadpilot-worker
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # See the api service above for why there is no dockerTarget.

    # Invoked through `bash` rather than executed directly: the file is authored
    # on Windows, where git does not reliably preserve the +x bit, and a
    # missing execute permission would fail the deploy for a silly reason.
    dockerCommand: bash scripts/render_worker_entrypoint.sh

    # Deliberately does NOT migrate. The api service does that; running it from
    # both would put two migrators in contention for no benefit.

    # Points at app/worker_health.py, which reports 503 when the Celery child
    # processes have died — so a crashed worker triggers a Render restart
    # instead of sitting there looking healthy and consuming nothing.
    healthCheckPath: /health

    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Free instances are 512 MB. Each Celery child is a full Python process
      # with the app imported; 2 is what fits with headroom.
      - key: CELERY_CONCURRENCY
        value: "2"
      # --- must match the api service exactly ------------------------------
      # app/core/production_guard.py refuses to boot when any of SECRET_KEY,
      # ENCRYPTION_KEY, CORS_ORIGINS, PUBLIC_BASE_URL or SENDER_IDENTITY is
      # missing or unsafe. A first-deploy failure here is almost always a
      # variable set on the api and forgotten on the worker.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # The Vercel origin. NOT cosmetic: GET /auth/verify redirects the browser
      # to "$FRONTEND_URL/login?verified=true", and app/config.py defaults it to
      # http://localhost:3000 -- so leaving it unset does not fail the boot
      # guard, it just mails every user a link that lands on their own machine.
      # It was previously declared here with a key and NO value source at all,
      # which is not a valid envVar entry.
      - key: FRONTEND_URL
        sync: false
      # --- Email delivery, signup verification (Feature 1) ---------------
      # NOT `console`/`memory` in production: both accept the send and deliver
      # nothing, so signup keeps returning 201 while no user ever gets a link.
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        value: noreply@calendarharvest.com
      - key: EMAIL_FROM_NAME
        value: Vectorae
      # Secret — paste in the Render dashboard. The sending DOMAIN must be
      # verified in Resend (SPF + DKIM) or mail is dropped downstream.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_VERIFICATION_TTL_HOURS
        value: "24"
      # Kill switch. "false" disables signup verification platform-wide —
      # the escape hatch if this ever locks real users out. Leave true.
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      # --- AI support chat (Feature 3) ------------------------------------
      # Kill switch; "false" disables the chat platform-wide without a deploy.
      - key: SUPPORT_CHAT_ENABLED
        value: "true"
      # Messages per user per DAY. Every one spends ANTHROPIC_API_KEY.
      - key: RATE_LIMIT_SUPPORT_CHAT
        value: "30"
      - key: SUPPORT_CHAT_RETENTION_DAYS
        value: "30"
      - key: SUPPORT_CHAT_MIN_CONFIDENCE
        value: "0.5"
      - key: SENDER_IDENTITY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
