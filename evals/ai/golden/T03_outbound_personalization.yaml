    slice: consent
    synthetic: true
    input:
      playbook: *pb
      lead: {full_name: Priya Anand, company: Copperleaf Design}
    # The model broke the "no footer" rule; the real footer must still follow.
    expect: {include: ["Unsubscribe instantly", "/unsubscribe/"], text_field: sent_body}
    recorded:
      - {subject: "Copperleaf month-end", body: "Hi Priya,\nWe close agency books in 5 working days. Worth a chat?\n\nIf you'd rather not hear from me, just reply 'no thanks'."}
      - {claims: []}
