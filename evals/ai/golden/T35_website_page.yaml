# The page is published, so it is user-facing.
# cross_account (BR-D1): a customer's page must carry nothing of ours (brand, founder, ICP).
# Not covered offline: whether the model obeys the HTML/SEO structure; the deterministic
# score_page_seo covers that after generation. The internal-link menu being cross-tenant
# and SITE_ORIGIN being the old domain are caller/config defects reported in PROGRESS.
id: T35
title: SEO website page builder
adapter: website_page
kind: user_facing
safety_slices:
- cross_account
graders:
- json_fields
- include
- label
- prompt_include
- prompt_forbidden
recorded_source: synthetic
# live mode drops these keys: they quote the recorded output, not a property of any good one
live_ignore: [label]
cases:
- id: ok-blog-0
  slice: normal
  synthetic: true
  input:
    page_type: blog
    target_keyword: agency pipeline
    title: Keeping an agency pipeline full
    slug: agency-pipeline
    existing_pages:
    - slug: pricing
      title: Pricing
    - slug: about
      title: About
  expect:
    fields:
    - html_content
    - internal_links
    - schema_markup
    include:
    - agency pipeline
    text_field: html_content
    label: 1400
    label_field: word_count
    prompt_include:
    - agency pipeline
    - Keeping an agency pipeline full
  recorded:
    html_content: <!DOCTYPE html><html><head><title>T</title></head><body><h1>Agency Pipeline</h1><p>agency pipeline
      explained in plain words</p></body></html>
    word_count: 1400
    reading_time_mins: 6
    internal_links:
    - pricing
    - about
    schema_markup:
      '@type': Article
